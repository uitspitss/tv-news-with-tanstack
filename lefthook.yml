pre-commit:
  commands:
    biome-check:
      glob: "*.{js,jsx,ts,tsx,json}"
      run: |
        FILES=$(echo {staged_files} | tr ' ' '\n' | grep -v '^\\.agents/' | grep -v '^\\.claude/' | tr '\n' ' ')
        if [ -n "$FILES" ]; then
          bunx --bun biome check --write $FILES
        fi
    knip:
      run: bun run knip
    typecheck:
      run: bun run type-check
