name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      # storybook プロジェクトは Chromium 実機で走る
      - run: bunx playwright install --with-deps chromium
      - run: bun run ci
      - run: bun run type-check
      - run: bun run test
      - run: bun run build
      - run: bun run build-storybook
      - run: bun run knip

  # lint の失敗を待たずに並列で回すため独立したジョブにする
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # ビルドは playwright.config.ts の webServer が行う
      - run: bun run test:e2e

      - uses: actions/upload-artifact@v7
        # failure() だと flaky（retry で通った）ケースの trace が取れない
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
