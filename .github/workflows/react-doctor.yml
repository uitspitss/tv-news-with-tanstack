name: React Doctor
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # scope: changed（PR が持ち込んだ問題のみ）は base との merge-base を
          # 必要とする。shallow checkout だと解決できず GitHub API に
          # フォールバックし、変更ファイル内の既存の問題まで報告される。
          fetch-depth: 0

      - uses: millionco/react-doctor@v2
