name: React Doctor
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # scope: changed（PR が持ち込んだ問題のみ）は base との merge-base を
          # 必要とする。shallow checkout だと解決できず GitHub API に
          # フォールバックし、変更ファイル内の既存の問題まで報告される。
          fetch-depth: 0

      - uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e # v2
